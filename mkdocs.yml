site_name: Mercado Público Chile SDK
site_description: SDK Python tipado para las APIs públicas de Mercado Público.
repo_url: https://github.com/eliezer/chile-public-market-sdk
theme:
  name: material
nav:
  - Inicio: index.md
  - Uso: usage.md
  - API: api.md
  - Arquitectura: architecture.md
  - Hacia v1.0.0: v1-roadmap.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
