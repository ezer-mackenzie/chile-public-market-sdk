site_name: Chile Public Market SDK
site_description: Typed Python SDK for Chile's Mercado Público APIs.
repo_url: https://github.com/eliezer/chile-public-market-sdk
theme:
  name: material
nav:
  - Home: index.md
  - Usage: usage.md
  - API: api.md
  - Public API: public-api.md
  - Architecture: architecture.md
  - Migration: migration.md
  - Versioning: versioning.md
  - Roadmap to v1.0.0: v1-roadmap.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
