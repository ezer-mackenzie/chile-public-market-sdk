name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - run: poetry install --extras "dev docs"
      - run: poetry run pytest --cov=chile_public_market_sdk
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry build
      - if: matrix.python-version == '3.12'
        run: poetry run mkdocs build --strict
      - if: github.event_name == 'schedule' && matrix.python-version == '3.12'
        env:
          CHILE_PUBLIC_MARKET_TICKET: ${{ secrets.CHILE_PUBLIC_MARKET_TICKET }}
          RUN_LIVE_CONTRACT_TESTS: "1"
        run: poetry run pytest -m live
