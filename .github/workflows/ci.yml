name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - uses: snok/install-poetry@v1
      - run: poetry config virtualenvs.in-project true
      - run: poetry install --extras "dev docs"
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry run pyright
      - run: poetry run mkdocs build --strict

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - uses: snok/install-poetry@v1
      - run: poetry config virtualenvs.in-project true
      - run: poetry install --extras "dev"
      - run: >-
          poetry run pytest -m "not live"
          --cov=chile_public_market_sdk
          --cov-report=xml
          --cov-fail-under=95
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  build:
    name: Build distributions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
      - run: poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"
      - name: Verify installed package
        run: >-
          python -c "from importlib.metadata import version;
          import chile_public_market_sdk as sdk;
          assert sdk.__version__ == version('mercado-publico-chile-sdk');
          assert sdk.SyncChilePublicMarketClient;
          assert sdk.AsyncChilePublicMarketClient"

  live-contracts:
    name: Protected live contracts
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
      - run: poetry install --extras "dev"
      - env:
          CHILE_PUBLIC_MARKET_TICKET: ${{ secrets.CHILE_PUBLIC_MARKET_TICKET }}
          RUN_LIVE_CONTRACT_TESTS: "1"
        run: poetry run pytest -m live
